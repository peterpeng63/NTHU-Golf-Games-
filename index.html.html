<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155e42"><title>清華校友｜比洞賽手機版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#172b22;font:16px -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif}header{background:#155e42;color:white;padding:19px 16px}header h1{font-size:22px;margin:0 0 4px}header small{opacity:.85}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #183e2512}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#526358;display:block;margin-bottom:5px}input{width:100%;min-width:0;font-size:17px;border:1px solid #cbd7cf;border-radius:9px;padding:10px;background:white;color:#172b22}input:focus{outline:2px solid #2b8a61}button{border:0;border-radius:10px;min-height:44px;padding:9px 13px;font-size:16px;font-weight:650;background:#e8f0eb;color:#155e42;cursor:pointer}button.primary{background:#155e42;color:white}button:disabled{opacity:.35}.nav{display:flex;gap:8px;align-items:center;justify-content:space-between}.nav strong{font-size:20px}.player{display:grid;grid-template-columns:minmax(0,1fr) 44px 58px 44px;align-items:center;gap:8px;border-bottom:1px solid #e7eee9;padding:11px 0}.player:last-child{border-bottom:0}.player .name{font-weight:650;overflow-wrap:anywhere}.player .score{font-size:24px;text-align:center;font-weight:750}.player small{display:block;color:#66796d;font-size:12px}.player button{font-size:23px;padding:0}.status{background:#e7f4ea;border-radius:9px;padding:10px;margin-top:12px;font-size:14px}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{padding:9px 8px;border-bottom:1px solid #e2eae4;text-align:center}th:first-child,td:first-child{text-align:left}th{background:#eff5f0}.pos{color:#08743e;font-weight:700}.neg{color:#ba3737;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px}.hint{color:#617166;font-size:13px;line-height:1.6}.badge{background:#e7f4ea;color:#17613f;padding:4px 7px;border-radius:6px;font-size:12px}#message{color:#a13b28;font-size:13px}.foot{text-align:center;color:#617166;font-size:12px;padding:8px 0 24px}@media(max-width:370px){.wrap{padding:8px}.card{padding:12px}.player{gap:5px;grid-template-columns:minmax(0,1fr) 42px 45px 42px}}
</style></head><body><header><h1>⛳ 清華校友四人比洞賽</h1><small>手機單人輸入版 V2.0｜18洞・6組對戰</small></header><div class="wrap">
<section class="card"><h2>比賽資料</h2><div class="grid"><div><label for="course">球場</label><input id="course" placeholder="球場名稱"></div><div><label for="date">日期</label><input id="date" type="date"></div><div><label for="event">賽事名稱</label><input id="event" placeholder="例賽"></div><div><label for="rate">每點金額（元）</label><input id="rate" type="number" min="0" max="100000" inputmode="numeric"></div></div><h2 style="margin-top:17px">球員姓名</h2><div class="grid" id="names"></div></section>
<section class="card"><div class="nav"><button id="prev" type="button">‹ 上一洞</button><strong id="holeTitle">第 1 洞</strong><button id="next" type="button" class="primary">下一洞 ›</button></div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px"><div><label for="par">本洞標準桿 Par</label><input id="par" type="number" min="3" max="6" inputmode="numeric" style="width:90px"></div><span id="progress" class="badge">0 / 18 洞完成</span></div><div id="players"></div><div class="status">一般勝洞 <b>1點</b>｜○ Birdie 勝洞 <b>2點</b>｜◎ Eagle 勝洞 <b>5點</b>｜同桿 <b>0點</b><br><small>Birdie／Eagle 依本洞 Par 自動判定。</small></div><p id="message" aria-live="polite"></p></section>
<section class="card"><h2>🏆 即時個人排名</h2><div class="scroll"><table id="ranking"></table></div><p class="hint">尚未輸入的球洞不計入對戰；完成18洞後才是正式結果。</p></section>
<section class="card"><h2>⚔️ 六組對戰</h2><div class="scroll"><table id="matches"></table></div></section>
<section class="card"><h2>📊 四人得點矩陣</h2><div class="scroll"><table id="matrix"></table></div><div id="check" class="status" aria-live="polite"></div></section>
<section class="card"><h2>儲存與分享</h2><div class="actions"><button id="export" class="primary" type="button">匯出成績 CSV</button><button id="backup" type="button">備份 JSON</button><button id="importBtn" type="button">匯入備份</button><button id="reset" type="button">開始新一場</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="hint">輸入後自動儲存於目前瀏覽器。更換手機或清除網站資料可能遺失，建議打完球匯出備份。iPhone 可使用 Safari 分享功能將網站加入主畫面。</p></section><div class="foot">清華校友高爾夫｜單人輸入模式 A</div></div>
<script>
(()=>{'use strict';const KEY='nthu_matchplay_mobile_v2';const defaultPar=[4,4,4,3,4,5,4,3,5,5,3,4,4,5,4,3,4,4];const initial=()=>({course:'',event:'',date:new Date().toLocaleDateString('en-CA'),rate:100,players:['球員1','球員2','球員3','球員4'],par:[...defaultPar],strokes:Array.from({length:4},()=>Array(18).fill(null))});let d=initial(),hole=0;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=(v,min,max)=>Number.isInteger(Number(v))&&v!==''&&v!==null&&Number(v)>=min&&Number(v)<=max;const valid=(i,h)=>num(d.strokes[i][h],1,20)&&num(d.par[h],3,6);const name=i=>d.players[i].trim()||`球員${i+1}`;const mark=(i,h)=>valid(i,h)?Number(d.strokes[i][h])===Number(d.par[h])-2?'◎':Number(d.strokes[i][h])===Number(d.par[h])-1?'○':'':'';const pts=(i,h)=>mark(i,h)==='◎'?5:mark(i,h)==='○'?2:1;const signed=n=>n>0?`<span class="pos">+${n}</span>`:n<0?`<span class="neg">${n}</span>`:'0';function sanitize(x){if(!x||!Array.isArray(x.players)||x.players.length!==4||!Array.isArray(x.par)||x.par.length!==18||!Array.isArray(x.strokes)||x.strokes.length!==4||!x.strokes.every(r=>Array.isArray(r)&&r.length===18))throw Error('備份格式不正確');return {...initial(),course:String(x.course||'').slice(0,100),event:String(x.event||'').slice(0,100),date:String(x.date||'').slice(0,10),rate:num(x.rate,0,100000)?Number(x.rate):100,players:x.players.map(s=>String(s||'').slice(0,50)),par:x.par.map(v=>num(v,3,6)?Number(v):4),strokes:x.strokes.map(r=>r.map(v=>num(v,1,20)?Number(v):null))}}try{const saved=localStorage.getItem(KEY);if(saved)d=sanitize(JSON.parse(saved))}catch(e){}function save(){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){$('message').textContent='無法自動儲存，請使用備份功能。'}}function renderHole(){ $('holeTitle').textContent=`第 ${hole+1} 洞`;$('prev').disabled=hole===0;$('next').disabled=hole===17;$('par').value=d.par[hole];$('progress').textContent=`${Array.from({length:18},(_,h)=>d.strokes.every((_,i)=>valid(i,h))).filter(Boolean).length} / 18 洞完成`;$('players').innerHTML=d.players.map((_,i)=>{let s=d.strokes[i][hole];return `<div class="player"><div class="name">${esc(name(i))}<small>${mark(i,hole)==='○'?'○ Birdie':mark(i,hole)==='◎'?'◎ Eagle':valid(i,hole)?Number(s)===Number(d.par[hole])?'Par':Number(s)>Number(d.par[hole])?'+'+(Number(s)-Number(d.par[hole])):'低於標準桿':'尚未輸入'}</small></div><button type="button" data-i="${i}" data-d="-1" aria-label="${esc(name(i))}減一桿">−</button><div class="score">${s===null?'—':s}</div><button type="button" data-i="${i}" data-d="1" aria-label="${esc(name(i))}加一桿">＋</button></div>`}).join('');$('players').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.i),delta=Number(b.dataset.d),s=d.strokes[i][hole];d.strokes[i][hole]=s===null?(delta===1?Number(d.par[hole]):null):Math.max(1,Math.min(20,s+delta));update()}))}function renderStats(){const matrix=Array.from({length:4},()=>Array(4).fill(0)),wins=Array(4).fill(0),loss=Array(4).fill(0);for(let h=0;h<18;h++)for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){if(!valid(i,h)||!valid(j,h))continue;const a=Number(d.strokes[i][h]),b=Number(d.strokes[j][h]);if(a<b)matrix[i][j]+=pts(i,h);else if(b<a)matrix[j][i]+=pts(j,h)}let matches='<tr><th>球員A</th><th>球員B</th><th>得點 A:B</th><th>淨勝(A)</th></tr>';for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){let a=matrix[i][j],b=matrix[j][i];if(a>b)wins[i]++,loss[j]++;else if(b>a)wins[j]++,loss[i]++;matches+=`<tr><td>${esc(name(i))}</td><td>${esc(name(j))}</td><td>${a}:${b}</td><td>${signed(a-b)}</td></tr>`}$('matches').innerHTML=matches;const totals=d.players.map((_,i)=>{let scored=matrix[i].reduce((a,b)=>a+b,0),conceded=matrix.reduce((a,r)=>a+r[i],0),strokes=d.strokes[i].reduce((a,s,h)=>a+(valid(i,h)?Number(s):0),0),count=d.strokes[i].filter((_,h)=>valid(i,h)).length;return {i,scored,conceded,net:scored-conceded,strokes,count,wins:wins[i],loss:loss[i]}});const ranked=[...totals].sort((a,b)=>b.net-a.net||b.wins-a.wins||a.strokes-b.strokes);$('ranking').innerHTML='<tr><th>名次</th><th>球員</th><th>桿數</th><th>得/失</th><th>淨勝</th><th>金額</th></tr>'+ranked.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(name(r.i))}</td><td>${r.strokes} (${r.count}洞)</td><td>${r.scored}/${r.conceded}</td><td>${signed(r.net)}</td><td>${signed(r.net*d.rate)}</td></tr>`).join('');$('matrix').innerHTML='<tr><th>得點者↓</th>'+d.players.map((_,i)=>`<th>${esc(name(i))}</th>`).join('')+'<th>合計</th></tr>'+totals.map((r,i)=>`<tr><th>${esc(name(i))}</th>${matrix[i].map((v,j)=>`<td>${i===j?'—':v}</td>`).join('')}<td>${r.scored}</td></tr>`).join('');const scored=totals.reduce((a,r)=>a+r.scored,0),conceded=totals.reduce((a,r)=>a+r.conceded,0),net=totals.reduce((a,r)=>a+r.net,0);$('check').textContent=`防呆驗算：總得點 ${scored}＝總失點 ${conceded}；淨勝合計 ${net} ${net===0&&scored===conceded?'✓':'⚠'}`;}function update(){renderHole();renderStats();save()}function populate(){['course','event','date','rate'].forEach(k=>$(k).value=d[k]);$('names').innerHTML=d.players.map((n,i)=>`<div><label for="p${i}">球員 ${i+1}</label><input id="p${i}" value="${esc(n)}"></div>`).join('');d.players.forEach((_,i)=>$('p'+i).addEventListener('input',e=>{d.players[i]=e.target.value;update()}));update()}['course','event','date','rate'].forEach(k=>$(k).addEventListener('input',e=>{d[k]=k==='rate'?Math.max(0,Math.min(100000,Number(e.target.value)||0)):e.target.value;update()}));$('par').addEventListener('change',e=>{if(!num(e.target.value,3,6)){$('message').textContent='標準桿必須是3至6';e.target.value=d.par[hole];return}$('message').textContent='';d.par[hole]=Number(e.target.value);update()});$('prev').addEventListener('click',()=>{hole=Math.max(0,hole-1);update()});$('next').addEventListener('click',()=>{hole=Math.min(17,hole+1);update()});function download(filename,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('backup').addEventListener('click',()=>download('比洞賽備份.json',JSON.stringify(d,null,2),'application/json'));$('export').addEventListener('click',()=>{let rows=[['球場',d.course],['日期',d.date],['賽事',d.event],['每點金額',d.rate],[],['球員/洞號',...Array.from({length:18},(_,i)=>i+1),'總桿'],['Par',...d.par,d.par.reduce((a,b)=>a+b,0)],...d.players.map((_,i)=>[name(i),...d.strokes[i].map((s,h)=>s===null?'':s+mark(i,h)),d.strokes[i].reduce((a,s,h)=>a+(valid(i,h)?Number(s):0),0)])];download('比洞賽成績.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')});$('importBtn').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{d=sanitize(JSON.parse(await f.text()));hole=0;populate();$('message').textContent='已匯入備份'}catch(err){$('message').textContent='匯入失敗：'+err.message}e.target.value=''});$('reset').addEventListener('click',()=>{if(confirm('確定開始新的一場？目前成績將清空，請先備份。')){d=initial();hole=0;populate()}});populate();})();
</script></body></html>
